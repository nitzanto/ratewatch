services:
  api:
    build:
      target: prod
    # Only reachable through nginx, as in production.
    ports: !reset []
    environment:
      # The image has no .env and refuses the dev secret: pass a real one from the shell.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to a random value of 32+ characters}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD to a random value}@redis:6379
    develop: !reset {}
    read_only: true
    tmpfs:
      - /tmp

  redis:
    # Only the API reaches it, with a password, as in production.
    ports: !reset []
    command:
      [
        redis-server,
        --maxmemory-policy,
        noeviction,
        --requirepass,
        '${REDIS_PASSWORD:?set REDIS_PASSWORD to a random value}',
      ]
    healthcheck:
      test:
        [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  web:
    build:
      target: prod
    ports: !override
      - 127.0.0.1:8080:8080
    depends_on:
      api:
        condition: service_healthy
    develop: !reset {}
    read_only: true
    # nginx renders its config into conf.d at start and keeps its pid and temp files in /tmp.
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
