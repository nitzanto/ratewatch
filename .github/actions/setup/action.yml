name: Setup
description: Node from .node-version, pnpm from packageManager with a cached store, dependencies installed, Nx affected SHAs set.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        # pnpm/action-setup caches the store; skip setup-node's cache so it isn't saved twice.
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
