name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # nx-set-shas reads past runs to find the last green commit on main.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm nx affected -t lint
      - run: pnpm nx affected -t typecheck
      - run: pnpm nx format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm nx affected -t test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm nx affected -t build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The API Nx serves for the suite counts clicks in Redis on localhost, as REDIS_URL in apps/api/.env says.
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # Nx hides successful tasks' output in CI; stream it so every test shows in the log.
      - run: pnpm nx affected -t e2e --output-style=stream
      # Upload passing runs too, so the report is there to compare against when one fails.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/test-output/playwright/report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # compose.prod.yaml needs a real session secret and Redis password: random ones per run.
      - run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "SESSION_SECRET=$secret" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "REDIS_PASSWORD=$password" >> "$GITHUB_ENV"
      # Runs when an app is affected, or when a root Docker file changes: those belong to no Nx project.
      - id: affected
        run: |
          apps=$(pnpm nx show projects --affected -p api web --json)
          if [ "$apps" != '[]' ] || ! git diff --quiet "$NX_BASE" "$NX_HEAD" -- compose.yaml compose.prod.yaml .dockerignore; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Builds the production images and runs them as compose.prod.yaml does: one origin through nginx.
      # shortcut: no cross-run layer cache (the Actions cache already hit its egress limit); add one if builds get slow.
      - if: ${{ steps.affected.outputs.run }}
        run: docker compose -f compose.yaml -f compose.prod.yaml up --build --wait
      - if: ${{ steps.affected.outputs.run }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors http://localhost:8080/api/health
      - if: ${{ failure() }}
        run: docker compose -f compose.yaml -f compose.prod.yaml logs
