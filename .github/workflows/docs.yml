name: Docs

# Publishes the engineering wiki (apps/docs) to GitHub Pages. CI builds it on pull requests.
on:
  push:
    branches: [main]
    # The lockfile too, so Astro and Starlight upgrades republish.
    paths: [apps/docs/**, pnpm-lock.yaml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  # The setup action's nx-set-shas reads past runs.
  actions: read

# One deployment at a time; never cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm nx build docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deploy-pages publishes to Pages and authenticates with an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
