# Compose Watch copies edits into the containers (no source bind mounts, so it behaves the same
# on Docker Desktop, Colima, OrbStack or Linux). Any other change to the app, the contracts or a
# root workspace file (lockfile, package.json, tsconfig, nx.json) rebuilds the image instead.
# `pull_policy: build` rebuilds on every `up` too (cached layers keep it quick), so a branch switched
# while nothing was watching never leaves a container serving old code.
name: ratewatch

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    pull_policy: build
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      redis:
        condition: service_healthy
    # The dev stage builds before it serves, so `up --wait` returns once the API answers, not when the container starts.
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2m
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync
          path: ./libs/contracts/src
          target: /app/libs/contracts/src
        - action: rebuild
          path: ./apps/api
          ignore: [src/]
        - action: rebuild
          path: ./libs/contracts
          ignore: [src/]
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./nx.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./tsconfig.json

  # The image is pinned to the one the API's concurrency test runs on (rate-limit.concurrency.spec.ts).
  redis:
    image: redis:8.10-alpine
    # A full Redis refuses writes instead of evicting keys, which would silently drop a custom limit or a pause.
    command: [redis-server, --maxmemory-policy, noeviction]
    # Published on localhost so an API run with pnpm (and the e2e suite) reaches it too.
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    pull_policy: build
    environment:
      API_URL: http://api:3000
    ports:
      - 127.0.0.1:4200:4200
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./apps/web/public
          target: /app/apps/web/public
        - action: sync
          path: ./apps/web/index.html
          target: /app/apps/web/index.html
        - action: sync
          path: ./libs/contracts/src
          target: /app/libs/contracts/src
        - action: rebuild
          path: ./apps/web
          ignore: [src/]
        - action: rebuild
          path: ./libs/contracts
          ignore: [src/]
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./nx.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./tsconfig.json
