packages:
  - 'apps/*'
  - 'libs/*'
allowBuilds:
  '@swc/core': true
  nx: true
  '@parcel/watcher': false
  unrs-resolver: false
  '@nestjs/core': false
  esbuild: false
  # Testcontainers' Docker client: the native speed-ups are optional and need a compiler.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Artillery's browser engine and StatsD reporter, which the traffic simulator doesn't use.
  '@playwright/browser-chromium': false
  unix-dgram: false
